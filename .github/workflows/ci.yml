name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The registry describes a live chain; drift is a real failure mode.
    - cron: '17 6 * * 1'

jobs:
  kit:
    name: kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install eth-account requests

      - name: Compile
        run: python -m compileall -q quoter.py tools/build_registry.py

      - name: Registry structure
        run: python tools/build_registry.py --check

      - name: USDG must be 6 decimals
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('data/registry.json'))
          got = d['quote_asset']['decimals']
          if got != 6:
              sys.exit(f"USDG decimals is {got}, expected 6 — this scales every order by 1e12")
          print("ok: USDG is 6 decimals")
          PY

      - name: Market calendar is current and well-formed
        run: |
          python - <<'PY'
          import json, sys, datetime
          cal = json.load(open('data/market_calendar.json'))
          today = datetime.date.today()
          through = datetime.date.fromisoformat(cal['verified_through'])
          problems = []
          # A calendar that expires without warning is worse than none at all.
          if through < today:
              problems.append(f"calendar expired on {through}")
          elif (through - today).days < 60:
              print(f"::warning::market calendar runs out on {through} — extend it")
          seen = set()
          for kind in ('holidays', 'early_closes'):
              for e in cal[kind]:
                  d = datetime.date.fromisoformat(e['date'])
                  if d.weekday() >= 5:
                      problems.append(f"{e['date']} ({e['name']}) falls on a weekend "
                                      "- observed dates only")
                  if (kind, e['date']) in seen:
                      problems.append(f"duplicate {kind} entry {e['date']}")
                  seen.add((kind, e['date']))
          for p in problems:
              print("  x", p)
          sys.exit(1 if problems else 0)
          PY

      - name: Python and JS session models agree
        run: |
          # Two implementations of the same clock will drift unless something
          # keeps checking. Sample every hour across a year, both must match.
          python - <<'PY' > /tmp/py_session.json
          import datetime, importlib.util, json
          from zoneinfo import ZoneInfo
          spec = importlib.util.spec_from_file_location("q", "quoter.py")
          q = importlib.util.module_from_spec(spec); spec.loader.exec_module(q)
          NY = ZoneInfo("America/New_York")
          out = {}
          t = datetime.datetime(2026, 1, 1, tzinfo=NY)
          end = datetime.datetime(2027, 1, 1, tzinfo=NY)
          while t < end:
              u = t.astimezone(datetime.timezone.utc)
              s = q.session_state(u)
              out[u.isoformat()] = [s['open'], s['minutes_until_change']]
              t += datetime.timedelta(hours=1)
          json.dump(out, open('/dev/stdout', 'w'))
          PY
          node -e "
          const l = require('./api/_lib.js');
          const py = require('/tmp/py_session.json');
          let bad = 0, n = 0;
          for (const [iso, [open, until]] of Object.entries(py)) {
            const s = l.sessionState(new Date(iso));
            n++;
            if (s.open !== open || s.minutes_until_change !== until) {
              if (bad < 5) console.log('MISMATCH', iso, {js: [s.open, s.minutes_until_change], py: [open, until]});
              bad++;
            }
          }
          console.log(n + ' samples, ' + bad + ' mismatches');
          if (bad) { console.log('session models disagree'); process.exit(1); }
          "

      - name: Session clock boundaries
        run: |
          python - <<'PY'
          import datetime, importlib.util, sys
          from zoneinfo import ZoneInfo
          spec = importlib.util.spec_from_file_location("q", "quoter.py")
          q = importlib.util.module_from_spec(spec); spec.loader.exec_module(q)
          NY = ZoneInfo("America/New_York")
          cases = [
              ((2026, 9, 2,  9, 29), False, "minute before the open"),
              ((2026, 9, 2,  9, 30), True,  "the open"),
              ((2026, 9, 2, 15, 59), True,  "minute before the close"),
              ((2026, 9, 2, 16,  0), False, "the close"),
              ((2026, 9, 5, 12,  0), False, "Saturday"),
              ((2026, 9, 6, 12,  0), False, "Sunday"),
              ((2026, 9, 4, 16,  1), False, "into the weekend"),
              ((2026, 9, 7,  9, 30), True,  "Monday reopen"),
          ]
          bad = 0
          for parts, expect, label in cases:
              dt = datetime.datetime(*parts, tzinfo=NY).astimezone(datetime.timezone.utc)
              got = q.session_state(dt)["open"]
              if got != expect:
                  print(f"FAIL {label}: open={got}, expected {expect}"); bad += 1
          sys.exit(bad and "session clock is wrong" or 0)
          PY

      - name: Simulator runs and attributes
        run: |
          python quoter.py demo --ticks 120 --seed 7 | tee /tmp/demo.txt
          grep -q "Half-spread captured" /tmp/demo.txt
          grep -q "Adverse selection" /tmp/demo.txt
          grep -q "Net, USDG" /tmp/demo.txt

      - name: Simulator is allowed to lose
        run: |
          # A model that cannot print a losing evening is a brochure.
          python - <<'PY'
          import subprocess, sys
          losses = 0
          for seed in range(1, 25):
              out = subprocess.run(
                  [sys.executable, "quoter.py", "demo", "--ticks", "200",
                   "--seed", str(seed), "--informed-rate", "0.5"],
                  capture_output=True, text=True).stdout
              if "negative evening" in out:
                  losses += 1
          print(f"{losses}/24 seeds lost money at informed-rate 0.5")
          if losses == 0:
              sys.exit("simulator never loses — that is a bug, not an edge")
          PY
